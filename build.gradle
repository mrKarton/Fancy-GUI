plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven { url 'https://maven.nucleoid.xyz' }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"fancy-gui" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation ("eu.pb4:polymer-core:0.18.2+26.3")
	implementation ("eu.pb4:polymer-autohost:0.18.2+26.3")
	implementation ("eu.pb4:polymer-resource-pack:0.18.2+26.3")

	implementation include ("xyz.nucleoid:server-translations-api:3.2.0+26.3")

	implementation ("eu.pb4:sgui:2.2.0+26.3")
}

fabricApi {
	configureDataGeneration() {
		client = true
		addToResources = true
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			groupId = project.group.toString()
			artifactId = "fancy-gui"
			version = project.version.toString()

			from components.java

			pom {
				name = "Fancy GUI"
				description = "Fabric GUI library with SGUI fallback and native client screens."
				url = "https://github.com/mrKarton/Fancy-GUI"

				licenses {
					license {
						name = "MIT"
						url = "https://opensource.org/licenses/MIT"
					}
				}

				scm {
					url = "https://github.com/mrKarton/Fancy-GUI"
					connection = "scm:git:https://github.com/mrKarton/Fancy-GUI.git"
				}
			}
		}
	}

	repositories {
		maven {
			name = "GitHubPackages"
			url = uri("https://maven.pkg.github.com/mrkarton/Fancy-GUI")

			credentials {
				username = providers.gradleProperty("gpr.user")
						.orElse(providers.environmentVariable("GITHUB_ACTOR"))
						.getOrNull()

				password = providers.gradleProperty("gpr.key")
						.orElse(providers.environmentVariable("GITHUB_TOKEN"))
						.getOrNull()
			}
		}
	}
}
